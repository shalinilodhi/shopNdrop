<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | ShopNDrop</title>

  <link rel="stylesheet" href="Project.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">
    <img src="images/shopNdrop.jpg" class="logo-img" alt="ShopNDrop">
    <span class="logo-text">ShopNDrop</span>
  </a>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="vendors/dashboard.html">Vendors</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="login/login.html" class="login-btn">Login</a></li>
  </ul>
</nav>


<!-- ===== HERO ===== -->
<header class="page-hero">
  <h1>Contact Us</h1>
  <p>We’re here to help — get in touch with ShopNDrop</p>
</header>

<!-- ===== CONTENT ===== -->
<main class="page-content">

  <!-- CONTACT INFO -->
  <div class="contact-grid">

    <div class="card">
      <h3>📍 Address</h3>
      <p>ShopNDrop HQ<br>Local Business Street<br>India</p>
    </div>

    <div class="card">
      <h3>📞 Phone</h3>
      <p>+91 98765 43210</p>
    </div>

    <div class="card">
      <h3>📧 Email</h3>
      <p>support@shopndrop.com</p>
    </div>

  </div>

  <!-- CONTACT FORM -->
  <div class="card contact-form">
    <h3>Send Us a Message</h3>

    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="4" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

</main>

<!-- ===== FOOTER ===== -->
<footer>
  <p>© 2025 ShopNDrop | Built with 💚</p>
</footer>

</body>
</html>
