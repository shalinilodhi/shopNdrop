<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | ShopNDrop</title>
  <link rel="stylesheet" href="register.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="register-container">
  <h2>Create Account</h2>
  <p>Register to get started</p>

  <form id="registerForm">

    <div class="role-select">
      <label><input type="radio" name="role" value="vendor" required> Vendor</label>
      <label><input type="radio" name="role" value="customer"> Customer</label>
    </div>

    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>

    <button type="submit">Register</button>
  </form>

  <a href="login.html" class="link">Already have an account? Login</a>
</div>

<script src="register.js"></script>
</body>
</html>
